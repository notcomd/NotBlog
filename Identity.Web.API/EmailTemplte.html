<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Email Template</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; line-height: 1.6;">
<!-- 外层容器 -->
<table cellpadding="0" cellspacing="0" style="max-width: 600px; margin: 20px auto; background-color: #ffffff;"
       width="100%">
    <!-- 头部 -->
    <tr>
        <td style="padding: 20px 30px; border-bottom: 1px solid #eeeeee;">
            <a href="#" style="text-decoration: none; color: #333333;">
                <img alt="Notcomd" src="logo-placeholder.png" style="display: block;" width="120">
            </a>
        </td>
    </tr>

    <!-- 正文内容 -->
    <tr>
        <td style="padding: 30px;">
            <h1 style="font-size: 24px; color: #333333; margin-top: 0;">尊敬的[姓名]：</h1>

            <p style="color: #666666; margin: 15px 0;">
                感谢您的来信。我们已收到您的咨询，将会在24小时内给您回复。
            </p>

            <p style="color: #666666; margin: 15px 0;">
                如需即时帮助，请联系我们的客服团队：<br>
                📞 电话：400-123-4567<br>
                📧 邮箱：support@company.com
            </p>
        </td>
    </tr>

    <!-- 尾部 -->
    <tr>
        <td style="padding: 20px 30px; background-color: #f8f9fa; color: #666666; font-size: 12px;">
            <p style="margin: 5px 0;">
                © 2023 公司名称 | 地址信息
            </p>
            <p style="margin: 5px 0;">
                <a href="#" style="color: #0066cc; text-decoration: none;">隐私政策</a> |
                <a href="#" style="color: #0066cc; text-decoration: none;">退订邮件</a>
            </p>
        </td>
    </tr>
</table>
</body>
</html>
