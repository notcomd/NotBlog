      IDENTITYPOSTGRES_HOST: "postgres"
      IDENTITYPOSTGRES_PORT: "5432"
      IDENTITYPOSTGRES_USERNAME: "postgres"
      IDENTITYPOSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      IDENTITYPOSTGRES_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/identitypostgres"
      IDENTITYPOSTGRES_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/identitypostgres"
      IDENTITYPOSTGRES_DATABASENAME: "identitypostgres"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
      ConnectionStrings__EventBus: "amqp://guest:${EVENTBUS_PASSWORD}@eventbus:5672"
      EVENTBUS_HOST: "eventbus"
      EVENTBUS_PORT: "5672"
      EVENTBUS_USERNAME: "guest"
      EVENTBUS_PASSWORD: "${EVENTBUS_PASSWORD}"
      EVENTBUS_URI: "amqp://guest:${EVENTBUS_PASSWORD}@eventbus:5672"
      FILEDEV_WEB_API_HTTP: "http://filedev-web-api:${FILEDEV_WEB_API_PORT}"
      services__filedev-web-api__http__0: "http://filedev-web-api:${FILEDEV_WEB_API_PORT}"
      FILEDEV_WEB_API_HTTPS: "https://filedev-web-api:${FILEDEV_WEB_API_PORT}"
      FileStorageGrpc__Address: "https://filedev-web-api"
      DbContextOption__DbContextConnect: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=identitypostgres;SSL Mode=Disable"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "identity-web-api"
    expose:
      - "5052:${IDENTITY_WEB_API_PORT}"
    ports: -"${IDENTITY_WEB_API_PORT}:9091"
    networks:
      - "aspire"
