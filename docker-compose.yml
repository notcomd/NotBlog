networks:
  aspire:
    driver: "bridge"
volumes:
  notblog.apphost-4e335c671b-postgres-data:
    driver: "local"
  notblog.apphost-4e335c671b-Redis-data:
    driver: "local"
  notblog.apphost-4e335c671b-EventBus-data:
    driver: "local"
