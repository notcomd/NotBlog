services:
  docker-compose-dashboard:
    image: "mcr.microsoft.com/dotnet/aspire-dashboard"
    ports:
      - "18888:18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/library/postgres:18.3"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "notblog.apphost-4e335c671b-postgres-data"
        read_only: false
    networks:
      - "aspire"
    restart: "always"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: "docker.io/library/redis:8.6"
    command:
      - "-c"
      - "redis-server --requirepass $$REDIS_PASSWORD --save 60 1"
    entrypoint:
      - "/bin/sh"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    expose:
      - "6379"
    volumes:
      - type: "volume"
        target: "/data"
        source: "notblog.apphost-4e335c671b-Redis-data"
        read_only: false
    networks:
      - "aspire"
    restart: "always"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  eventbus:
    image: "docker.io/library/rabbitmq:4.3"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "${EVENTBUS_PASSWORD}"
    expose:
      - "5672"
    volumes:
      - type: "volume"
        target: "/var/lib/rabbitmq"
        source: "notblog.apphost-4e335c671b-EventBus-data"
        read_only: false
    networks:
      - "aspire"
    restart: "always"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  filedev-web-api:
    build:
      context: ../FileDev.Web.API
      dockerfile: Dockerfile
    depends_on:
      # ✅ 新增依赖
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eventbus:
        condition: service_healthy
    environment:
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY}"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${FILEDEV_WEB_API_PORT}"
      ConnectionStrings__NotFilePostgres: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=notfilepostgres;SSL Mode=Disable"
      NOTFILEPOSTGRES_HOST: "postgres"
      NOTFILEPOSTGRES_PORT: "5432"
      NOTFILEPOSTGRES_USERNAME: "postgres"
      NOTFILEPOSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      NOTFILEPOSTGRES_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/notfilepostgres"
      NOTFILEPOSTGRES_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/notfilepostgres"
      NOTFILEPOSTGRES_DATABASENAME: "notfilepostgres"
      ConnectionStrings__CacheMemory: "redis:6379,password=${REDIS_PASSWORD}"
      CACHEMEMORY_HOST: "redis"
      CACHEMEMORY_PORT: "6379"
      CACHEMEMORY_PASSWORD: "${REDIS_PASSWORD}"
      CACHEMEMORY_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
      ConnectionStrings__EventBus: "amqp://guest:${EVENTBUS_PASSWORD}@eventbus:5672"
      EVENTBUS_HOST: "eventbus"
      EVENTBUS_PORT: "5672"
      EVENTBUS_USERNAME: "guest"
      EVENTBUS_PASSWORD: "${EVENTBUS_PASSWORD}"
      EVENTBUS_URI: "amqp://guest:${EVENTBUS_PASSWORD}@eventbus:5672"
      DbContextConnect: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=notfilepostgres;SSL Mode=Disable"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "filedev-web-api"
    expose:
      - "${FILEDEV_WEB_API_PORT}"
    ports:
      - "${FILEDEV_WEB_API_PORT}:9093"
    networks:
      - "aspire"
  identity-web-api:
