      POSTGRESSQL_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/messagepostgres"
      POSTGRESSQL_DATABASENAME: "messagepostgres"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      REDIS_HOST: "redis"
