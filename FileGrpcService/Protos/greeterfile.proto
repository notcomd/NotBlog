syntax = "proto3";

option csharp_namespace = "FileGrpcService";

package greeterfile;

service GrpcFile{
  rpc UploadFileAsync(stream FileRequest)returns(FileResponse);
}

message FileRequest{
  string fileName = 1;
  bytes fileContent = 2;
}

message FileResponse{
  string fileName = 1;
  string fileContent = 2;
}